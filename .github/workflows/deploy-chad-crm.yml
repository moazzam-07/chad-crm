name: Build and deploy Chad CRM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: chad-crm-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/moazzam-07/chad-crm:${{ github.sha }}
            ghcr.io/moazzam-07/chad-crm:production

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/chad-crm-deploy
          chmod 600 ~/.ssh/chad-crm-deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull and deploy production image
        env:
          DEPLOY_KEY: ~/.ssh/chad-crm-deploy
        run: |
          ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "REGISTRY_USER='$REGISTRY_USER' REGISTRY_TOKEN='$REGISTRY_TOKEN' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker pull "ghcr.io/moazzam-07/chad-crm:$RELEASE_SHA"
          docker logout ghcr.io >/dev/null 2>&1 || true

          sed -i 's#^SERVER_URL=.*#SERVER_URL=https://chad-crm.demgrow.online#' /opt/twenty/.env
          if grep -q '^EMAIL_FROM_NAME=' /opt/twenty/.env; then
            sed -i 's#^EMAIL_FROM_NAME=.*#EMAIL_FROM_NAME="Chad CRM"#' /opt/twenty/.env
          else
            printf '\nEMAIL_FROM_NAME="Chad CRM"\n' >> /opt/twenty/.env
          fi

          cat > /opt/twenty/docker-compose.override.yml <<OVERRIDE
          services:
            server:
              image: ghcr.io/moazzam-07/chad-crm:$RELEASE_SHA
            worker:
              image: ghcr.io/moazzam-07/chad-crm:$RELEASE_SHA
          OVERRIDE

          cd /opt/twenty
          docker compose up -d --force-recreate server worker

          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/healthz >/dev/null; then
              echo "Chad CRM is healthy at release $RELEASE_SHA"
              exit 0
            fi
            sleep 5
          done

          docker compose ps
          docker compose logs --tail=100 server
          exit 1
          REMOTE
