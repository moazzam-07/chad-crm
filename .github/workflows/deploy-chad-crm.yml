name: Build and deploy Chad CRM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chad-crm-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/chad-crm-deploy
          chmod 600 ~/.ssh/chad-crm-deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Build and deploy on production
        env:
          DEPLOY_KEY: ~/.ssh/chad-crm-deploy
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          repo_dir=/opt/chad-crm
          if [ ! -d "$repo_dir/.git" ]; then
            git clone --filter=blob:none --depth=1 https://github.com/moazzam-07/chad-crm.git "$repo_dir"
          fi

          cd "$repo_dir"
          git fetch --filter=blob:none --depth=1 origin main
          git checkout --detach "$RELEASE_SHA"

          docker build \
            --target twenty \
            --file packages/twenty-docker/twenty/Dockerfile \
            --tag chad-crm:production \
            .

          sed -i 's#^SERVER_URL=.*#SERVER_URL=https://chad-crm.demgrow.online#' /opt/twenty/.env
          if grep -q '^EMAIL_FROM_NAME=' /opt/twenty/.env; then
            sed -i 's#^EMAIL_FROM_NAME=.*#EMAIL_FROM_NAME="Chad CRM"#' /opt/twenty/.env
          else
            printf '\nEMAIL_FROM_NAME="Chad CRM"\n' >> /opt/twenty/.env
          fi

          cat > /opt/twenty/docker-compose.override.yml <<'OVERRIDE'
          services:
            server:
              image: chad-crm:production
            worker:
              image: chad-crm:production
          OVERRIDE

          cd /opt/twenty
          docker compose up -d --force-recreate server worker

          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/healthz >/dev/null; then
              echo "Chad CRM is healthy at release $RELEASE_SHA"
              exit 0
            fi
            sleep 5
          done

          docker compose ps
          docker compose logs --tail=100 server
          exit 1
          REMOTE